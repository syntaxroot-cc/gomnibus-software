name: ncurses
default_version: "6.4"
license: MIT
license_file: "https://invisible-island.net/ncurses/ncurses-license.html"

source:
  url: "https://ftp.gnu.org/gnu/ncurses/ncurses-6.4.tar.gz"
  sha256: "6931283d9ac87c5073f30b6290c4c75f21632bb4fc3603ac8100812bed248159"

relative_path: "ncurses-6.4"

versions:
  - version: "6.3"
    source:
      url: "https://ftp.gnu.org/gnu/ncurses/ncurses-6.3.tar.gz"
      sha256: "97fc51ac2b085d4cde31ef4d2c3122c21abc217e9090a43a30fc5ec21684e059"
    relative_path: "ncurses-6.3"

build:
  - configure:
      - "--enable-overwrite"
      - "--with-shared"
      - "--with-termlib"
      - "--without-ada"
      - "--without-cxx-binding"
      - "--without-debug"
      - "--without-manpages"
  - make: []
  - make:
      - install
